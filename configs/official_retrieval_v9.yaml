paths:
  # V9 is a separate frozen corpus; do not mix it with V8, demo, or uploaded documents.
  docs: data/official_retrieval_v9_no_sample_docs
  index: data/index/official_retrieval_v9_tfidf_index.joblib
  output: data/output/official_retrieval_v9
retrieval:
  mode: tfidf
  top_k: 5
  min_score: 0.0
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  hybrid_alpha: 0.5
reranker:
  enabled: false
  mode: lexical
  top_k: 5
query_rewrite:
  enabled: false
  mode: rule_based
chunking:
  max_chars: 1200
  overlap: 120
quality:
  min_citations: 1
llm_answer:
  enabled: false
  mode: template
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  model_env: OPENAI_MODEL
external_docs:
  enabled: true
  imported_docs_dir: data/docs_imported/official_v9
  manifest_filename: corpus_manifest_v9.json
  max_external_docs_per_source: 20
  max_file_size_kb: 1024
web:
  uploaded_docs_dir: data/official_retrieval_v9_no_uploaded_docs
  allow_github_clone: false
